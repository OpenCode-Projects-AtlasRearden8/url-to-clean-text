[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "url-to-clean-text"
version = "0.1.0"
description = "Fetch a URL and emit clean plain text for pasting into any AI tool, with optional local-LLM summaries."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["ai", "prompts", "text-extraction", "web-scraping", "local-llm", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.urls]
Homepage = "https://dylanasdale.github.io"

[project.scripts]
url-to-clean-text = "url_to_clean_text.cli:main"

[tool.setuptools]
packages = ["url_to_clean_text"]

[tool.pytest.ini_options]
testpaths = ["tests"]
